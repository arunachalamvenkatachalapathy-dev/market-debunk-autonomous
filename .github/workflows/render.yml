name: Market Debunk Render Farm (manual jobs only)
on:
  workflow_dispatch:
    inputs:
      job_branch:
        description: 'Branch holding the job bundle (jobs/<id>)'
        required: true
        type: string
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout job bundle
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.job_branch }}
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core python3 python3-pip >/dev/null
          ffmpeg -version | head -1
      - name: Render video
        run: bash job/render_job.sh
      - name: Upload result pack
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: error

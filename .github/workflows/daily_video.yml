name: Daily Autonomous Video Pipeline

on:
  schedule:
    # 4 videos per day across peak Indian engagement hours (IST = UTC + 5:30)
    # 1. 08:00 AM IST (02:30 UTC) - Morning pre-market commute
    - cron: '30 2 * * *'
    # 2. 01:00 PM IST (07:30 UTC) - Lunch break & mid-day market update
    - cron: '30 7 * * *'
    # 3. 05:30 PM IST (12:00 UTC) - Post-market close wrap
    - cron: '0 12 * * *'
    # 4. 09:00 PM IST (15:30 UTC) - Prime evening leisure
    - cron: '30 15 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit dedup history back to repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Bebas Neue Font
        run: |
          mkdir -p ~/.local/share/fonts
          if [ -f "assets/fonts/BebasNeue-Regular.ttf" ]; then
            echo "Copying Bebas Neue from repository assets..."
            cp assets/fonts/BebasNeue-Regular.ttf ~/.local/share/fonts/
          else
            echo "Downloading Bebas Neue from Google Fonts repository..."
            curl -fL "https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf" \
              -o ~/.local/share/fonts/BebasNeue-Regular.ttf
          fi
          fc-cache -fv ~/.local/share/fonts
          echo "Installed fonts matching Bebas:"
          fc-list : family | grep -i "Bebas" || echo "WARNING: Bebas Neue not found"

      - name: Setup YouTube Cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
            echo "Cookies file created successfully."
          else
            echo "No YT_COOKIES secret found. Proceeding without cookies."
          fi

      - name: Restore visual generation cache
        uses: actions/cache@v4
        with:
          path: output/visual_cache
          key: visual-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            visual-cache-${{ runner.os }}-

      - name: Run Pipeline (Manager Agent)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_SCRIPT_API_KEY: ${{ secrets.GEMINI_SCRIPT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMMA_FALLBACK_MODEL: ${{ secrets.GEMMA_FALLBACK_MODEL || 'gemma-3-27b-it' }}
          GEMINI_IMAGE_API_KEY: ${{ secrets.GEMINI_IMAGE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ENABLE_YT_UPLOAD: ${{ secrets.ENABLE_YT_UPLOAD || 'true' }}
          ALLOW_PUBLICATION: ${{ secrets.ALLOW_PUBLICATION || 'true' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          ENABLE_TELEGRAM: ${{ secrets.ENABLE_TELEGRAM || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_INSTAGRAM: ${{ secrets.ENABLE_INSTAGRAM }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_VIDEO_URL: ${{ secrets.INSTAGRAM_VIDEO_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN }}
          ENABLE_FACEBOOK: ${{ secrets.ENABLE_FACEBOOK || 'true' }}
        run: python -m src.agents.manager

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-shorts
          path: output/**/distribution_ready.mp4
          retention-days: 7

      - name: Upload Tamil master visual package
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: market-debunk-master-package
          path: output/**/master_visual_package/**
          retention-days: 7

      - name: Commit Deduplication Data
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/used_topics.json data/channel_ids.json data/used_broll.json
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update topic and broll dedup history [skip ci]" && git push)

      - name: Trigger Tamil companion pipeline
        if: success()
        env:
          GH_TOKEN: ${{ secrets.TAMIL_WORKFLOW_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAMIL_WORKFLOW_TOKEN is missing. English completed, but Tamil trigger was skipped."
            exit 0
          fi
          gh workflow run daily_video.yml \
            --repo arunachalamvenkatachalapathy-dev/market-debunk-tamil \
            --ref master \
            -f english_run_id="${{ github.run_id }}"

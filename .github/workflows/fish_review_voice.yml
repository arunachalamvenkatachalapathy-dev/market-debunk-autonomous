name: TA009 solo free voice production
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Generate selected Tamil male free model only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          for n in 1 4 5 8; do python scripts/generate_fish_review.py --text-file "review_scripts/ta009_line$n.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta009_line$n.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ta009-repair-audio
          path: out/*.mp3
          retention-days: 2
          if-no-files-found: error

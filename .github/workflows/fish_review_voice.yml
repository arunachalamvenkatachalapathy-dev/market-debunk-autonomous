name: TA006 Liya scripting sample
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: User-linked Liya, free model
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          python scripts/generate_fish_review.py --text-file "review_scripts/ta006_liya_scriptreview.txt" --reference-id 470085b5522b4579a0c7b02f1029d257 --output "out/ta006_liya_scriptreview.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: ta006-liya-scriptreview
          path: out/*.mp3
          retention-days: 2

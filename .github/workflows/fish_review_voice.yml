name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python -m pip install --disable-pip-version-check faster-whisper
          mkdir -p out
          python scripts/whisper_qa.py | tee out/whisper_qa.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vwhisper
          path: out/whisper_qa.txt
          retention-days: 2
          if-no-files-found: error

          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l4b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l4c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta102_l5a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta102_l5b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta102_l5c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l6a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l6b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l6c.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: v102-voices
          path: out/*102_l*.mp3
          retention-days: 2
          if-no-files-found: error

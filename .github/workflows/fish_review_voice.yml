name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line1.txt --output out/en097_l1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line1.txt --output out/en097_l1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line1.txt --output out/en097_l1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line2.txt --output out/en097_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line2.txt --output out/en097_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line2.txt --output out/en097_l2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line3.txt --output out/en097_l3a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line3.txt --output out/en097_l3b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line3.txt --output out/en097_l3c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line4.txt --output out/en097_l4a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line4.txt --output out/en097_l4b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line4.txt --output out/en097_l4c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line5.txt --output out/en097_l5a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line5.txt --output out/en097_l5b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line5.txt --output out/en097_l5c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line6.txt --output out/en097_l6a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line6.txt --output out/en097_l6b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en097_line6.txt --output out/en097_l6c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l3a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l3b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l3c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l4a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l4b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l4c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l5a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l5b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l5c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l6a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l6b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta097_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta097_l6c.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: v097-voices
          path: out/*097_l*.mp3
          retention-days: 2
          if-no-files-found: error

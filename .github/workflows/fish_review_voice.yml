name: Tamil006 duo free voice review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected Tamil voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file "review_scripts/en015_fix1.txt" --output "out/en015_fix1.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: nl015-fix1
          path: out/*015_fix*.mp3
          retention-days: 2
          if-no-files-found: error

name: Fish S2.1 Pro Free review voice (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Synthesize private review narration via developer API
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || { echo 'Missing FISH_AUDIO_API_KEY repository secret'; exit 1; }
          python scripts/generate_fish_review.py \
            --text-file review_scripts/ed1-solo-dcc.txt \
            --output out/ed1-solo-dcc-elite.mp3
          python -c "from pathlib import Path; p=Path('out/ed1-solo-dcc-elite.mp3'); assert p.stat().st_size > 1000"
      - name: Save review audio, never publish
        uses: actions/upload-artifact@v4
        with:
          name: ed1-solo-dcc-elite-review-audio
          path: out/ed1-solo-dcc-elite.mp3
          retention-days: 7
          if-no-files-found: error

  tamil-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Short Tamil pronunciation probes, review only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || { echo 'Missing Fish key'; exit 1; }
          python scripts/generate_fish_review.py --text-file review_scripts/tamil-pronunciation-probe.txt --output out/tamil-elite-probe.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/tamil-pronunciation-probe.txt --reference-id 31792949c082466bab25d6f3327ac216 --output out/tamil-sneha-probe.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: tamil-elite-and-sarah-pronunciation-probes
          path: out/tamil-*-probe.mp3
          retention-days: 7
          if-no-files-found: error

  tamil-native-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate private Tamil native-clause QA audio
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/tamil-elite-test.txt --output out/tamil-elite-native-test.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/tamil-sneha-test.txt --reference-id 31792949c082466bab25d6f3327ac216 --output out/tamil-sneha-native-test.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: tamil-native-clause-qa
          path: out/tamil-*-native-test.mp3
          retention-days: 7
          if-no-files-found: error

  tamil-full-script-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate private paragraph audio for transcript QA
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          for n in 1 2 3 4 5; do python scripts/generate_fish_review.py --text-file "review_scripts/qa-solo-$n.txt" --output "out/qa-solo-$n.mp3"; done
          for n in 1 2 3 4 5 6 7; do
            case "$n" in 1|3|5) voice=31792949c082466bab25d6f3327ac216;; *) voice=d8a1340984ee4b63ad1ffae27a6a4339;; esac
            python scripts/generate_fish_review.py --text-file "review_scripts/qa-duo-$n.txt" --reference-id "$voice" --output "out/qa-duo-$n.mp3"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tamil-full-script-paragraph-qa
          path: out/qa-*.mp3
          retention-days: 7
          if-no-files-found: error

  day-001-en-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Private English rank-one narration
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/day_001_m_en.txt --output out/day_001_m_en.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: day-001-en-review-audio
          path: out/day_001_m_en.mp3
          retention-days: 7
          if-no-files-found: error

  tamil-male-alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Compare two Tamil-labelled male references privately
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/tamil-elite-test.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/tamil-makkal-test.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/tamil-elite-test.txt --reference-id 324f49797a924f60a3004950b40d0f0e --output out/tamil-south-male-test.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: tamil-male-alternative-qa
          path: out/tamil-*-test.mp3
          retention-days: 7
          if-no-files-found: error

  tamil-south-full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Private full paragraph QA of Tamil male reference
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          for n in 1 2 3 4 5; do python scripts/generate_fish_review.py --text-file "review_scripts/qa-solo-$n.txt" --reference-id 324f49797a924f60a3004950b40d0f0e --output "out/qa-south-solo-$n.mp3"; done
          for n in 2 4 6 7; do python scripts/generate_fish_review.py --text-file "review_scripts/qa-duo-$n.txt" --reference-id 324f49797a924f60a3004950b40d0f0e --output "out/qa-south-duo-$n.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: tamil-south-full-qa
          path: out/qa-south-*.mp3
          retention-days: 7
          if-no-files-found: error

  day-001-e-en-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Private English rank-two duo narration
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/day_001_e_en-liya.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/day_001_e_liya.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/day_001_e_en-arun.txt --output out/day_001_e_arun.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: day-001-e-en-review-audio
          path: out/day_001_e_*.mp3
          retention-days: 7
          if-no-files-found: error

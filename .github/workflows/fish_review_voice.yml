name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/ta046_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta046_s1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta046_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta046_s1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta046_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta046_s1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta046_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta046_s1d.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: str046-repair2
          path: out/ta046_s1*.mp3
          retention-days: 2
          if-no-files-found: error

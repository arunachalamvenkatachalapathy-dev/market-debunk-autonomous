          python scripts/generate_fish_review.py --text-file review_scripts/en073_line5.txt --output out/en073_l5a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l5a.mp3

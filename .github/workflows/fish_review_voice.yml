name: TA012 duo free voice production
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Generate selected Tamil male free model only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          python scripts/generate_fish_review.py --text-file "review_scripts/ta012_line1.txt" --reference-id 470085b5522b4579a0c7b02f1029d257 --output "out/ta012_line1.mp3"
          python scripts/generate_fish_review.py --text-file "review_scripts/ta012_line6.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta012_line6.mp3"
          python scripts/generate_fish_review.py --text-file "review_scripts/ta012_line8.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta012_line8.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: ta012-final-repairs
          path: out/*.mp3
          retention-days: 2
          if-no-files-found: error

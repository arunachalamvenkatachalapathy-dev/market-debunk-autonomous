name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          for n in 1 3 5 7; do python scripts/generate_fish_review.py --text-file "review_scripts/ta018_line$n.txt" --reference-id 470085b5522b4579a0c7b02f1029d257 --output "out/ta018_line$n.mp3"; done
          for n in 2 4 6 8; do python scripts/generate_fish_review.py --text-file "review_scripts/ta018_line$n.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta018_line$n.mp3"; done
          for n in 1 3 5 7; do python scripts/generate_fish_review.py --text-file "review_scripts/en018_line$n.txt" --reference-id 933563129e564b19a115bedd57b7406a --output "out/en018_line$n.mp3"; done
          for n in 2 4 6 8; do python scripts/generate_fish_review.py --text-file "review_scripts/en018_line$n.txt" --output "out/en018_line$n.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: audit018-voices
          path: out/*018_line*.mp3
          retention-days: 2
          if-no-files-found: error

name: Tamil007 solo free voice review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate Tamil Makkal only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          for n in 5 6; do python scripts/generate_fish_review.py --text-file "review_scripts/ta007_line$n.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta007_line$n.mp3"; done
      - name: Brand pronunciation takes
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          for n in 1 2 3; do python scripts/generate_fish_review.py --text-file "review_scripts/ta007_brand$n.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta007_brand$n.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: tamil007-cta-repair-audio
          path: out/ta007_*.mp3
          retention-days: 2
          if-no-files-found: error

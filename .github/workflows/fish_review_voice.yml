name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run:       - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l1d.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l2d.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l5a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l5b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l5c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta074_l5d.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l6a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l6b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l6c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta074_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta074_l6d.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: v074b-voices
          path: out/*074_l*.mp3
          retention-days: 2
          if-no-files-found: error

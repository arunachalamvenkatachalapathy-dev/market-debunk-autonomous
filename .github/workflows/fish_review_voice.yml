          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta102_l2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line3.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta102_l3a.mp3

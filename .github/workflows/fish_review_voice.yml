name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line1.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line1.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line1.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line2.txt --output out/en102_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line2.txt --output out/en102_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line2.txt --output out/en102_l2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line3.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l3a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line3.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l3b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line3.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l3c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line4.txt --output out/en102_l4a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line4.txt --output out/en102_l4b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line4.txt --output out/en102_l4c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line5.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l5a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line5.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l5b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line5.txt --reference-id 933563129e564b19a115bedd57b7406a --output out/en102_l5c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line6.txt --output out/en102_l6a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line6.txt --output out/en102_l6b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en102_line6.txt --output out/en102_l6c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta102_l1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta102_line1.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta102_l1b.mp3

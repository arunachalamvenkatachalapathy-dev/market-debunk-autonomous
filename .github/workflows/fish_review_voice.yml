          python scripts/generate_fish_review.py --text-file review_scripts/en073_line6.txt --output out/en073_l6c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l6c.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: v073-voices
          path: out/*073_l*.mp3
          retention-days: 2
          if-no-files-found: error

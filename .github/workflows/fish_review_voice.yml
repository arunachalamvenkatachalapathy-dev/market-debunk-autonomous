name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          mkdir -p out; echo ok > out/qa099_l.mp3
          python -m pip install --disable-pip-version-check faster-whisper
          cat > qa_run.py <<'PYEOF'
          from faster_whisper import WhisperModel
          import glob
          m=WhisperModel('small',device='cpu',compute_type='int8')
          for f in sorted(glob.glob('qa_audio/*.mp3')):
              lang='ta' if '/ta' in f else 'en'
              segs,_=m.transcribe(f,language=lang,beam_size=5)
              print('RESULT',f,'|',' '.join(x.text.strip() for x in segs))
          PYEOF
          python qa_run.py
      - uses: actions/upload-artifact@v4
        with:
          name: v099-voices
          path: out/*099_l*.mp3
          retention-days: 2
          if-no-files-found: error

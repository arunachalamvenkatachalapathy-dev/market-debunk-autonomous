name: Fish S2.1 Pro Free review voice (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tamil-004-silver-duo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Private Tamil rank 004 duo pronunciation QA
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          for n in 1 3 5; do python scripts/generate_fish_review.py --text-file "review_scripts/day_002_e_ta_line$n.txt" --reference-id 470085b5522b4579a0c7b02f1029d257 --output "out/silver_line$n.mp3"; done
          for n in 2 4 6; do python scripts/generate_fish_review.py --text-file "review_scripts/day_002_e_ta_line$n.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/silver_line$n.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: tamil-004-silver-duo-audio
          path: out/silver_line*.mp3
          retention-days: 2
          if-no-files-found: error

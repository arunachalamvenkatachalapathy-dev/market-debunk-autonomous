name: TA003 accurate closing repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Selected Tamil male free model
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          for n in 4 6; do python scripts/generate_fish_review.py --text-file "review_scripts/ta003_repair$n.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta003_line$n.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ta003-repair
          path: out/*.mp3
          retention-days: 2

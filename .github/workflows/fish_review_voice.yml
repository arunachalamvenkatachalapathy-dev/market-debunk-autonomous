name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/ta022_fix3.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta022_fix3.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta022_fix7.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta022_fix7.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta022_fix8.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta022_fix8.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: traps022-repair378
          path: out/ta022_fix*.mp3
          retention-days: 2
          if-no-files-found: error

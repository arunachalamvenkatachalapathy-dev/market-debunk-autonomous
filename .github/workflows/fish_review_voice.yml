name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line1.txt --output out/en099_l1d.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line1.txt --output out/en099_l1e.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line1.txt --output out/en099_l1f.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line2.txt --output out/en099_l2d.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line2.txt --output out/en099_l2e.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line2.txt --output out/en099_l2f.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line3.txt --output out/en099_l3d.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line3.txt --output out/en099_l3e.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line3.txt --output out/en099_l3f.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line4.txt --output out/en099_l4d.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line4.txt --output out/en099_l4e.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en099_line4.txt --output out/en099_l4f.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: v099b-voices
          path: out/*099_l*.mp3
          retention-days: 2
          if-no-files-found: error

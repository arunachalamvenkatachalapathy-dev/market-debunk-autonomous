          python scripts/generate_fish_review.py --text-file review_scripts/ta094_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta094_l4c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta094_line5.txt --reference-id 470085b5522b4579a0c7b02f1029d257 --output out/ta094_l5a.mp3

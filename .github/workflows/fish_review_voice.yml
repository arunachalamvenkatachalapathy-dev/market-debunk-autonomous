name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r4a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r4b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r4c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r5a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r5b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r5c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r6a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r6b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta039_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta039_r6c.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: pyramid039-repair1
          path: out/ta039_r*.mp3
          retention-days: 2
          if-no-files-found: error

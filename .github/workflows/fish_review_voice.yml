          python scripts/generate_fish_review.py --text-file review_scripts/ta094_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta094_l6b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta094_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta094_l6c.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: v094-voices
          path: out/*094_l*.mp3
          retention-days: 2
          if-no-files-found: error

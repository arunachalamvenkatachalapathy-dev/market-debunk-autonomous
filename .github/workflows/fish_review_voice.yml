name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/en023_line1.txt --output out/en023_line1.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en023_line2.txt --output out/en023_line2.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en023_line3.txt --output out/en023_line3.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en023_line4.txt --output out/en023_line4.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en023_line5.txt --output out/en023_line5.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en023_line6.txt --output out/en023_line6.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta023_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta023_line1.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta023_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta023_line2.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta023_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta023_line3.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta023_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta023_line4.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta023_line5.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta023_line5.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta023_line6.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta023_line6.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: car023-voices
          path: out/*023_line*.mp3
          retention-days: 2
          if-no-files-found: error

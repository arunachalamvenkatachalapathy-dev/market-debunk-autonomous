name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/en067_line2.txt --output out/en067_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en067_line2.txt --output out/en067_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en067_line2.txt --output out/en067_l2c.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: stock067fix-voices
          path: out/*067_l*.mp3
          retention-days: 2
          if-no-files-found: error

name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line1.txt --output out/en073_l1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line1.txt --output out/en073_l1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line1.txt --output out/en073_l1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line2.txt --output out/en073_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l2a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line2.txt --output out/en073_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l2b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line2.txt --output out/en073_l2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line2.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l2c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line3.txt --output out/en073_l3a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l3a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line3.txt --output out/en073_l3b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l3b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line3.txt --output out/en073_l3c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l3c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line4.txt --output out/en073_l4a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta073_line4.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta073_l4a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/en073_line4.txt --output out/en073_l4b.mp3

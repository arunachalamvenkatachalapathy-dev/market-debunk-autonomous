name: Selected bilingual review voices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Generate selected review voices only
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          test -n "$FISH_AUDIO_API_KEY" || exit 1
          python scripts/generate_fish_review.py --text-file review_scripts/ta033_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta033_r1a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta033_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta033_r1b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta033_line1.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta033_r1c.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta033_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta033_r3a.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta033_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta033_r3b.mp3
          python scripts/generate_fish_review.py --text-file review_scripts/ta033_line3.txt --reference-id 90e23b74530d433f915aba3ba2bdf596 --output out/ta033_r3c.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: intraday033-repair1
          path: out/ta033_r*.mp3
          retention-days: 2
          if-no-files-found: error

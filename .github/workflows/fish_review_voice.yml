name: TA008 selected duo voice review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Selected Tamil duo free models
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          python scripts/generate_fish_review.py --text-file "review_scripts/ta008_outroA.txt" --reference-id 90e23b74530d433f915aba3ba2bdf596 --output "out/ta008_outroA.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: ta008-outro-a-clean
          path: out/*.mp3
          retention-days: 2
